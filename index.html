<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Perangkat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background-color: #1c2541;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3a506b;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 {
            color: #4ea8de;
            margin: 0;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .arrow-up {
            color: #4ea8de;
            font-size: 0.8rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .label {
            color: #a5a5a5;
            font-style: italic;
        }
        .value {
            font-weight: bold;
            text-align: right;
        }
        .badge {
            background-color: #06d6a0;
            color: #0b132b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 8px;
            font-style: normal;
        }
        .highlight-blue { color: #4ea8de; }
        .highlight-green { color: #06d6a0; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-box">
            <h2>📱 TENTANG PERANGKAT</h2>
            <span class="arrow-up">▲</span>
        </div>
        
        <div class="info-row">
            <span class="label">Tipe Perangkat</span>
            <span class="value"><span class="badge">📳 HP</span><span id="tipe-perangkat">Smartphone / HP</span></span>
        </div>

        <div class="info-row">
            <span class="label">Model Perangkat</span>
            <span class="value" id="model-perangkat" style="text-transform: uppercase;">Mencari...</span>
        </div>

        <div class="info-row">
            <span class="label">Versi Sistem Android</span>
            <span class="value highlight-blue" id="os-versi">Mencari...</span>
        </div>

        <div class="info-row">
            <span class="label">Resolusi Layar HP</span>
            <span class="value highlight-blue" id="layar-resolusi">Mencari...</span>
        </div>

        <div class="info-row">
            <span class="label">Status Baterai</span>
            <span class="value highlight-green" id="status-baterai">Mencari...</span>
        </div>

        <div class="info-row">
            <span class="label">Mode Orientasi Default</span>
            <span class="value highlight-blue" id="orientasi-layar">Mencari...</span>
        </div>
    </div>

    <script>
        function dapatkanInfoPerangkat() {
            const ua = navigator.userAgent;
            let os = "Bukan Android";
            let model = "Desktop / PC";

            // 1. Deteksi OS & Model Android
            if (/Android/i.test(ua)) {
                const matchVersi = ua.match(/Android\s([0-9\.]+)/);
                os = matchVersi ? `Android ${matchVersi[1]}` : "Android";
                
                const matchModel = ua.match(/Linux; Android[^;]+;\s([^)]+)/);
                if (matchModel) {
                    // Membersihkan teks build number jika ikut terbawa
                    model = matchModel[1].split(' Build/')[0]; 
                }
            } else if (/iPhone|iPad/i.test(ua)) {
                os = "iOS";
                model = /iPhone/i.test(ua) ? "iPhone" : "iPad";
                document.getElementById('tipe-perangkat').innerText = "iOS Device";
            }

            document.getElementById('model-perangkat').innerText = model;
            document.getElementById('os-versi').innerText = os;

            // 2. Deteksi Resolusi Layar asli (dikali pixel ratio perangkat)
            const lebar = window.screen.width * window.devicePixelRatio;
            const tinggi = window.screen.height * window.devicePixelRatio;
            document.getElementById('layar-resolusi').innerText = `${Math.round(lebar)} x ${Math.round(tinggi)} Pixels`;

            // 3. Deteksi Orientasi Layar
            const orientasi = window.screen.width > window.screen.height ? "Landscape" : "Portrait (Smartphone)";
            document.getElementById('orientasi-layar').innerText = orientasi;

            // 4. Deteksi Status Baterai (Menggunakan Battery API Web standard)
            if (navigator.getBattery) {
                navigator.getBattery().then(function(battery) {
                    function updateBaterai() {
                        const level = Math.round(battery.level * 100);
                        const cas = battery.charging ? "⚡ Mengisi Daya" : "🔋 Tidak Dicas";
                        document.getElementById('status-baterai').innerText = `${level}% (${cas})`;
                    }
                    updateBaterai();
                    battery.addEventListener('levelchange', updateBaterai);
                    battery.addEventListener('chargingchange', updateBaterai);
                });
            } else {
                document.getElementById('status-baterai').innerText = "Tidak Didukung Browser";
            }
        }

        // Jalankan fungsi ketika seluruh dokumen selesai dimuat
        window.addEventListener('DOMContentLoaded', dapatkanInfoPerangkat);
    </script>

</body>
</html>
