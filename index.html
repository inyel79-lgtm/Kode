<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Perangkat</title>
    <style>
        /* TEMA WARNA CYBERPUNK NEON */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050811;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            overflow: hidden;
            position: relative;
        }

        /* ANIMASI BACKGROUND GELOMBANG PURE CSS (ANTI-MACET) */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(78, 168, 222, 0.15) 0%, transparent 70%);
            top: 20%;
            left: 20%;
            animation: gerakGlow 8s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes gerakGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .card {
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
            border: 1px solid rgba(100, 223, 223, 0.3);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 30px rgba(78, 168, 222, 0.25);
            box-sizing: border-box;
        }

        h2 {
            color: #64dfdf;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(100, 223, 223, 0.5);
            border-bottom: 2px solid #3a506b;
            padding-bottom: 12px;
        }

        .info-box {
            margin-bottom: 18px;
        }

        .label {
            font-size: 0.8rem;
            color: #a5a5a5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(5, 8, 17, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #4ea8de;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: #06d6a0;
            color: #050811;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* DESAIN TOMBOL PREMIUM */
        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #4ea8de, #64dfdf);
            color: #050811;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(100, 223, 223, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-action:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(100, 223, 223, 0.2);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
        <h2>⚡ Data Sistem HP ⚡</h2>
        
        <div class="info-box">
            <div class="label">Sistem Operasi / OS</div>
            <div class="value">Android 13 <span class="badge" style="background-color: #4ea8de; color: #fff;">API 33</span></div>
        </div>

        <div class="info-box">
            <div class="label">Model Perangkat Asli</div>
            <div class="value">XIAOMI 2201117PG</div>
        </div>

        <div class="info-box">
            <div class="label">Resolusi Layar Fisik</div>
            <div class="value">1080 x 2402 Pixels</div>
        </div>

        <div class="info-box">
            <div class="label">Status Koneksi Core</div>
            <div class="value">ONLINE / AKTIF <span class="badge">SECURE</span></div>
        </div>

        <div class="info-box">
            <div class="label">Mode Orientasi Default</div>
            <div class="value" style="color: #64dfdf;">Portrait (Smartphone)</div>
        </div>

        <!-- TOMBOL INTERAKTIF CSS -->
        <a href="javascript:location.reload()" class="btn-action">🔄 SEGARKAN SISTEM</a>
    </div>

</body>
</html>
