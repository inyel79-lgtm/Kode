<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Perangkat</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #1c2541;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            color: #4ea8de;
            border-bottom: 2px solid #3a506b;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.1rem;
        }
        .baris {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .kiri { color: #a5a5a5; font-style: italic; }
        .kanan { font-weight: bold; color: #4ea8de; text-align: right; }
    </style>
</head>
<body>

    <div class="card">
        <h2> TENTANG PERANGKAT (INSTAN)</h2>
        
        <div class="baris">
            <span class="kiri">Sistem Operasi / OS</span>
            <span class="kanan" id="os">Memuat...</span>
        </div>
        <div class="baris">
            <span class="kiri">Model Perangkat</span>
            <span class="kanan" id="model">Memuat...</span>
        </div>
        <div class="baris">
            <span class="kiri">Resolusi Layar</span>
            <span class="kanan" id="layar">Memuat...</span>
        </div>
        <div class="baris">
            <span class="kiri">Orientasi</span>
            <span class="kanan" id="orientasi">Memuat...</span>
        </div>
        <div class="baris">
            <span class="kiri">Data Mentah Browser</span>
            <span class="kanan" id="mentah" style="font-size:0.75rem; font-weight:normal; word-break:break-all; color:#8ecae6;">Memuat...</span>
        </div>
    </div>

    <script>
        // KODE LANGSUNG BERJALAN INSTAN TANPA MENUNGGU APAPUN
        try {
            var ua = navigator.userAgent;
            var osInfo = "Bukan Android";
            var modelInfo = "Desktop PC";

            // Deteksi Android Sederhana
            if (ua.indexOf("Android") !== -1) {
                osInfo = "Android";
                var bagianAndroid = ua.split("Android ");
                if (bagianAndroid[1]) {
                    osInfo = "Android " + bagianAndroid[1].split(";")[0];
                }
                
                var bagianModel = ua.split("Linux; Android ");
                if (bagianModel[1]) {
                    var detailModel = bagianModel[1].split("; ");
                    if (detailModel[1]) {
                        modelInfo = detailModel[1].split(" Build/")[0];
                    }
                }
            } else if (ua.indexOf("iPhone") !== -1) {
                osInfo = "iOS";
                modelInfo = "iPhone";
            }

            // Langsung isi ke HTML detik ini juga
            document.getElementById("os").innerHTML = osInfo;
            document.getElementById("model").innerHTML = modelInfo;
            document.getElementById("layar").innerHTML = (window.screen.width * window.devicePixelRatio) + " x " + (window.screen.height * window.devicePixelRatio) + " px";
            document.getElementById("orientasi").innerHTML = window.screen.width > window.screen.height ? "Landscape" : "Portrait";
            document.getElementById("mentah").innerHTML = ua;

        } catch (error) {
            alert("Terjadi masalah pada pemuatan data: " + error.message);
        }
    </script>

</body>
</html>
