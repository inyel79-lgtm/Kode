<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektor Perangkat Otomatis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050811;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(78, 168, 222, 0.15) 0%, transparent 70%);
            top: 20%;
            left: 20%;
            animation: gerakGlow 8s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes gerakGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .card {
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
            border: 1px solid rgba(100, 223, 223, 0.3);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 30px rgba(78, 168, 222, 0.25);
            box-sizing: border-box;
        }

        h2 {
            color: #64dfdf;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(100, 223, 223, 0.5);
            border-bottom: 2px solid #3a506b;
            padding-bottom: 12px;
        }

        .section-title {
            font-size: 0.8rem;
            color: #64dfdf;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 8px 0;
            font-weight: bold;
        }

        .info-box {
            margin-bottom: 12px;
        }

        .label {
            font-size: 0.75rem;
            color: #a5a5a5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(5, 8, 17, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 4px solid #4ea8de;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: #06d6a0;
            color: #050811;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #4ea8de, #64dfdf);
            color: #050811;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            text-decoration: none;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(100, 223, 223, 0.3);
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
        <h2>⚡ ANALISIS PERANGKAT OTOMATIS </h2>
        
        <div class="section-title">Jenis & Kategori</div>
        <div class="info-box">
            <div class="label">Tipe Sistem Perangkat</div>
            <div class="value" id="tipe-sistem">Mendeteksi... <span class="badge" id="badge-tipe" style="background-color: #4ea8de; color: #fff;">...</span></div>
        </div>

        <div class="info-box">
            <div class="label">Nama / Model Perangkat</div>
            <div class="value" id="model-sistem">Mendeteksi...</div>
        </div>

        <div class="section-title">Spesifikasi Layar Fisik</div>
        <div class="info-box">
            <div class="label">Resolusi Monitor / Layar</div>
            <div class="value" id="resolusi-sistem">Mendeteksi...</div>
        </div>

        <div class="info-box">
            <div class="label">Mode Orientasi Tampilan</div>
            <div class="value" id="orientasi-sistem" style="color: #64dfdf;">Mendeteksi...</div>
        </div>

        <div class="section-title">Data Pengenal Dokumen</div>
        <div class="info-box">
            <div class="label">Sistem Operasi / Versi</div>
            <div class="value" id="os-dasar">Mendeteksi...</div>
        </div>

        <button onclick="location.reload()" class="btn-action">🔄 PINDAI ULANG PERANGKAT</button>
    </div>

    <script>
        // FUNGSI UNTUK MEMANTAU ORIENTASI SECARA LIVE
        function perbaruiOrientasiLayar() {
            try {
                // Mendeteksi orientasi berdasarkan perbandingan lebar dan tinggi jendela browser terbaru
                var lebarSkara = window.innerWidth;
                var tinggiSkara = window.innerHeight;
                
                var orientasiStr = "Portrait (Smartphone)";
                if (lebarSkara > tinggiSkara) {
                    orientasiStr = "Landscape (Dimiringkan)";
                }
                
                document.getElementById("orientasi-sistem").innerHTML = orientasiStr;
            } catch (e) {}
        }

        function jalankanDeteksiOtomatis() {
            var ua = navigator.userAgent;
            var tipeStr = "Desktop PC / Laptop";
            var badgeStr = "COMPUTER";
            var badgeWarna = "#4ea8de";
            var modelStr = "Windows / Mac PC";
            var osStr = "Windows OS";

            try {
                if (/Android/i.test(ua)) {
                    tipeStr = "Smartphone / HP";
                    badgeStr = "ANDROID";
                    badgeWarna = "#06d6a0";
                    osStr = "Android OS";
                    modelStr = "Xiaomi Perangkat";
                    
                    var cariVersi = ua.match(/Android\s([0-9\.]+)/);
                    if (cariVersi) {
                        osStr = "Android " + cariVersi[1];
                    }
                    
                    var cariModel = ua.match(/Linux; Android[^;]+;\s([^)]+)/);
                    if (cariModel) {
                        modelStr = cariModel[1].split(" Build/")[0];
                    }
                } else if (/iPhone|iPad|iPod/i.test(ua)) {
                    tipeStr = "Mobile / Tablet";
                    badgeStr = "APPLE iOS";
                    badgeWarna = "#ffd166";
                    osStr = "iOS System";
                    modelStr = /iPhone/i.test(ua) ? "iPhone" : "iPad";
                } else if (/Windows NT/i.test(ua)) {
                    tipeStr = "Desktop PC / Laptop";
                    badgeStr = "WINDOWS";
                    badgeWarna = "#0078d4";
                    osStr = "Windows OS";
                    modelStr = "Personal Computer (PC)";
                }

                document.getElementById("tipe-sistem").innerHTML = tipeStr + ' <span class="badge" id="badge-tipe">' + badgeStr + '</span>';
                document.getElementById("badge-tipe").style.backgroundColor = badgeWarna;
                document.getElementById("model-sistem").innerHTML = modelStr;
                document.getElementById("os-dasar").innerHTML = osStr;

                var lebarFisik = Math.round(window.screen.width * (window.devicePixelRatio || 1));
                var tinggiFisik = Math.round(window.screen.height * (window.devicePixelRatio || 1));
                document.getElementById("resolusi-sistem").innerHTML = lebarFisik + " x " + tinggiFisik + " Pixels";
                
                // Jalankan deteksi orientasi awal
                perbaruiOrientasiLayar();

            } catch(e) {
                document.getElementById("os-dasar").innerHTML = "Android System";
            }

            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"])
                        .then(function(hints) {
                            if (hints.model && hints.model !== "K" && hints.model !== "") {
                                document.getElementById("model-sistem").innerHTML = hints.model;
                            }
                            if (hints.platformVersion) {
                                var versiUtama = hints.platformVersion.split(".")[0];
                                if (/Android/i.test(ua) || badgeStr === "ANDROID") {
                                    document.getElementById("os-dasar").innerHTML = "Android " + versiUtama;
                                }
                            }
                        }).catch(function(){});
                }
            } catch (err) {}
        }

        window.addEventListener('DOMContentLoaded', jalankanDeteksiOtomatis);
        
        // PENGAMAN OTOMATIS: Dijalankan setiap kali layar HP diputar (Resize / Rotate)
        window.addEventListener('resize', perbaruiOrientasiLayar);
        window.addEventListener('orientationchange', perbaruiOrientasiLayar);
    </script>

</body>
</html>
