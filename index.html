<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Perangkat & Baterai</title>
    <!-- Memanggil library pendeteksi device lewat CDN -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .box-perangkat {
            background-color: #0c1524;
            border: 1px solid #1a293d;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header {
            color: #4da6ff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .label {
            color: #a0aec0;
            font-style: italic;
        }

        .nilai {
            font-weight: bold;
            text-align: right;
        }

        .warna-biru {
            color: #38bdf8;
        }

        .warna-hijau {
            color: #10b981;
        }

        .badge-hp {
            background-color: #059669;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="box-perangkat">
        <div class="header">
            <span>📱 TENTANG PERANGKAT</span>
            <span>▲</span>
        </div>

        <div class="baris">
            <span class="label">Tipe Perangkat</span>
            <span class="nilai"><span class="badge-hp">📱 HP</span> <span id="tipe">Memuat...</span></span>
        </div>

        <div class="baris">
            <span class="label">Model Perangkat</span>
            <span class="nilai" id="model" style="text-transform: uppercase;">Memuat...</span>
        </div>

        <div class="baris">
            <span class="label">Versi Sistem Android</span>
            <span class="nilai warna-biru" id="os">Memuat...</span>
        </div>

        <div class="baris">
            <span class="label">Resolusi Layar HP</span>
            <span class="nilai warna-biru" id="resolusi">Memuat...</span>
        </div>

        <div class="baris">
            <span class="label">Status Baterai</span>
            <span class="nilai warna-hijau" id="baterai">Memuat API Baterai...</span>
        </div>

        <div class="baris">
            <span class="label">Mode Orientasi Default</span>
            <span class="nilai warna-biru" id="orientasi">Memuat...</span>
        </div>
    </div>

    <script>
        // 1. PROSES DETEKSI PERANGKAT (UA-Parser)
        const parser = new UAParser();
        const info = parser.getResult();

        const tipePerangkat = info.device.type === 'mobile' ? 'Smartphone / HP' : (info.device.type === 'tablet' ? 'Tablet' : 'Desktop / PC');
        document.getElementById('tipe').innerText = tipePerangkat;

        const vendor = info.device.vendor ? info.device.vendor : '';
        const model = info.device.model ? info.device.model : 'Tidak Diketahui';
        document.getElementById('model').innerText = `${vendor} ${model}`.trim();

        const namaOS = info.os.name ? info.os.name : 'Unknown OS';
        const versiOS = info.os.version ? info.os.version : '';
        document.getElementById('os').innerText = `${namaOS} ${versiOS}`;


        // 2. PROSES DETEKSI RESOLUSI LAYAR
        // Mengambil lebar asli (screen.width) x tinggi asli (screen.height) dikali rasio pixel perangkat
        const lebarAsli = screen.width * window.devicePixelRatio;
        const tinggiAsli = screen.height * window.devicePixelRatio;
        document.getElementById('resolusi').innerText = `${lebarAsli} x ${tinggiAsli} Pixel`;


        // 3. PROSES DETEKSI BATERAI (Menggunakan Battery Status API bawaan Browser)
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                // Fungsi update tampilan data baterai
                function updateInfoBaterai() {
                    const levelBaterai = Math.round(battery.level * 100);
                    const sedangDicharge = battery.charging ? "⚡ Sedang Di-charger" : "🔋 Tidak Di-charger";
                    
                    document.getElementById('baterai').innerText = `${levelBaterai}% (${sedangDicharge})`;
                }

                // Jalankan saat pertama kali dibuka
                updateInfoBaterai();

                // Deteksi otomatis jika kabel charger dicolok/dicabut atau persentase berubah
                battery.addEventListener('chargingchange', updateInfoBaterai);
                battery.addEventListener('levelchange', updateInfoBaterai);
            });
        } else {
            document.getElementById('baterai').innerText = "Tidak didukung oleh browser ini";
        }


        // 4. DETEKSI ORIENTASI LAYAR
        function cekOrientasi() {
            if (window.innerHeight > window.innerWidth) {
                document.getElementById('orientasi').innerText = "Portrait (Smartphone)";
            } else {
                document.getElementById('orientasi').innerText = "Landscape (Desktop/Tablet)";
            }
        }
        cekOrientasi();
        window.addEventListener('resize', cekOrientasi); // Otomatis berubah saat HP dimiringkan
    </script>

</body>
</html>
